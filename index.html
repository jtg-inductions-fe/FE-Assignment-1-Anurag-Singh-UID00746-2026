<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/styles/main.scss" />
    </head>

    <body>
        <header class="header">
            <div class="header__container">
                <a href="/" class="header__logo" aria-label="Travlog Homepage">
                    <img
                        src="assets/images/logo-header.svg"
                        alt="Travlog Logo"
                    />
                </a>
                <button
                    type="button"
                    class="header__toggle"
                    id="header__toggle"
                    aria-label="Toggle navigation menu"
                    aria-expanded="false"
                    aria-controls="header-nav"
                >
                    <i class="ic-hamburger-menu" aria-hidden="true"></i>
                </button>
                <nav
                    class="header__nav"
                    id="header-nav"
                    aria-label="Main navigation"
                >
                    <ul class="header__menu">
                        <li>
                            <a
                                href="#"
                                class="header__link header__link--active"
                                aria-current="page"
                            >
                                Home
                            </a>
                        </li>
                        <li><a href="#" class="header__link">Discover</a></li>
                        <li>
                            <a href="#" class="header__link">Special Deals</a>
                        </li>
                        <li><a href="#" class="header__link">Contact</a></li>
                    </ul>
                </nav>
                <div class="header__actions">
                    <a
                        href="#"
                        class="btn btn--secondary"
                        aria-label="Login button"
                    >
                        Log In
                    </a>
                    <a
                        href="#"
                        class="btn btn--primary"
                        aria-label="Signup button"
                    >
                        Sign Up
                    </a>
                </div>
            </div>
        </header>
        <main>
            <section class="hero">
                <img
                    src="assets/images/overlay-hero-dots.svg"
                    alt="Dots pattern"
                    class="hero__dot-pattern"
                    aria-hidden="true"
                />
                <div class="hero__container">
                    <div class="hero__visuals">
                        <img
                            src="assets/images/hero-visual.webp"
                            alt="Hero image"
                        />
                    </div>
                    <div class="hero__content">
                        <div class="hero__eyebrow">
                            <i class="ic-hero-explore"></i>
                            <span class="hero__eyebrow-text">
                                Explore the world!
                            </span>
                        </div>
                        <h1 class="hero__title">
                            <span class="break-line">
                                Travel
                                <span class="hero__title--highlight">top</span>
                            </span>
                            <span class="break-line">
                                <span class="hero__title--highlight">
                                    destination
                                </span>
                                of the
                            </span>
                            <span class="break-line"> world </span>
                        </h1>
                        <p class="hero__description">
                            We always make our customer happy by providing as
                            many choices as possible
                        </p>
                        <div class="hero__actions">
                            <button
                                type="button"
                                class="btn btn--primary"
                                aria-label="Get Started button"
                            >
                                Get Started
                            </button>
                            <button
                                type="button"
                                class="btn btn--secondary"
                                aria-label="Watch Demo button"
                            >
                                <i class="ic-hero-play"></i>
                                Watch Demo
                            </button>
                        </div>
                    </div>
                </div>
                <div class="hero__partners">
                    <img
                        src="assets/images/logo-tripadvisor.svg"
                        alt="Tripadvisor Logo"
                        class="hero__partner-logo"
                        loading="lazy"
                        aria-hidden="true"
                    />
                    <img
                        src="assets/images/logo-expedia.svg"
                        alt="Expedia Logo"
                        class="hero__partner-logo"
                        loading="lazy"
                        aria-hidden="true"
                    />
                    <img
                        src="assets/images/logo-booking.svg"
                        alt="Booking.com Logo"
                        class="hero__partner-logo"
                        loading="lazy"
                        aria-hidden="true"
                    />
                    <img
                        src="assets/images/logo-airbnb.svg"
                        alt="Airbnb Logo"
                        class="hero__partner-logo"
                        loading="lazy"
                        aria-hidden="true"
                    />
                    <img
                        src="assets/images/logo-orbitz.svg"
                        alt="Orbitz Logo"
                        class="hero__partner-logo"
                        loading="lazy"
                        aria-hidden="true"
                    />
                </div>
            </section>
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
