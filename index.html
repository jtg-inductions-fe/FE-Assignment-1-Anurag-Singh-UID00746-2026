<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <header class="header">
            <div class="header__container">
                <a href="/" class="header__logo" aria-label="Travlog Homepage">
                    <img
                        src="/assets/images/logo-header.svg"
                        alt="Travlog Logo"
                    />
                </a>
                <button
                    type="button"
                    class="header__toggle"
                    aria-label="Toggle navigation menu"
                    aria-expanded="false"
                    aria-controls="header-nav"
                >
                    <i class="ic-hamburger-menu" aria-hidden="true"></i>
                </button>
                <nav
                    class="header__nav"
                    id="header-nav"
                    aria-label="Main navigation"
                >
                    <ul class="header__menu">
                        <li>
                            <a
                                href="#"
                                class="header__link header__link--active"
                                aria-current="page"
                            >
                                Home
                            </a>
                        </li>
                        <li><a href="#" class="header__link">Discover</a></li>
                        <li>
                            <a href="#" class="header__link">Special Deals</a>
                        </li>
                        <li><a href="#" class="header__link">Contact</a></li>
                    </ul>
                </nav>
                <div class="header__actions">
                    <a
                        href="#"
                        class="btn btn__secondary"
                        aria-label="Login Button"
                    >
                        Log In
                    </a>
                    <a
                        href="#"
                        class="btn btn__primary"
                        aria-label="Signup button"
                    >
                        Sign Up
                    </a>
                </div>
            </div>
        </header>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
